<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отзывы - InteriorStudio</title>
    <link rel="stylesheet" href="/css/main.css">
    <style>
        .review-photo {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 4px;
            margin-bottom: 12px;
            background: #F5F0E8;
        }
        
        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #E0E0E0;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .file-upload-wrapper:hover {
            border-color: #C27B5C;
        }
        
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
            object-fit: contain;
            background: #F5F0E8;
        }
        
        /* Правильный порядок звёзд: 1 слева, 5 справа */
        .star-rating {
            display: flex;
            gap: 8px;
            justify-content: flex-start;
            direction: rtl;
        }
        
        .star-rating input {
            display: none;
        }
        
        .star-rating label {
            font-size: 36px;
            color: #D0D0D0;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        
        /* При наведении подсвечиваем текущую и все слева (которые визуально правее из-за rtl) */
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #F4B740;
        }
        
        /* Выбранная звезда и все "меньшие" (визуально правее) */
        .star-rating input:checked ~ label {
            color: #F4B740;
        }
        
        .star-rating input:checked ~ label {
            transform: scale(1.1);
        }
        
        .star-rating label:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>
    <main>
        <section class="page-header">
            <div class="container">
                <h1>Отзывы клиентов</h1>
                <p>Что говорят о нашей работе</p>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="grid-3" id="reviewsGrid"></div>
            </div>
        </section>

        <section class="section" style="background: #F5F0E8;">
            <div class="container">
                <div class="section-header">
                    <h2>Оставить отзыв</h2>
                    <p>Ваш отзыв будет опубликован после модерации</p>
                </div>
                
                <div class="alert alert-success" id="successAlert" style="display: none; max-width: 600px; margin: 0 auto 20px;">
                    Отзыв отправлен на модерацию!
                </div>
                
                <div class="alert alert-error" id="errorAlert" style="display: none; max-width: 600px; margin: 0 auto 20px;">
                    <ul id="errorList"></ul>
                </div>
                
                <div class="card" style="max-width: 600px; margin: 0 auto;">
                    <div class="card-content" style="padding: 32px;">
                        <form id="reviewForm">
                            <div style="margin-bottom: 16px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500;">Ваше имя *</label>
                                <input type="text" id="reviewName" required style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                            </div>
                            
                            <div style="margin-bottom: 16px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500;">Оценка</label>
                                <!-- Порядок в HTML: 5, 4, 3, 2, 1 (но из-за direction: rtl визуально будет 1, 2, 3, 4, 5 слева направо) -->
                                <div class="star-rating">
                                    <input type="radio" id="star5" name="rating" value="5">
                                    <label for="star5" title="5 звёзд">★</label>
                                    <input type="radio" id="star4" name="rating" value="4">
                                    <label for="star4" title="4 звезды">★</label>
                                    <input type="radio" id="star3" name="rating" value="3">
                                    <label for="star3" title="3 звезды">★</label>
                                    <input type="radio" id="star2" name="rating" value="2">
                                    <label for="star2" title="2 звезды">★</label>
                                    <input type="radio" id="star1" name="rating" value="1">
                                    <label for="star1" title="1 звезда">★</label>
                                </div>
                            </div>
                            
                            <div style="margin-bottom: 16px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500;">Ваш отзыв *</label>
                                <textarea id="reviewText" required rows="4" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px; resize: vertical;"></textarea>
                            </div>
                            
                            <div style="margin-bottom: 20px;">
                                <label style="display: block; margin-bottom: 6px; font-weight: 500;">Фото (необязательно)</label>
                                <div class="file-upload-wrapper">
                                    <input type="file" id="reviewPhoto" accept="image/*">
                                    <span class="file-placeholder">Нажмите чтобы добавить фото</span>
                                    <img id="previewImage" class="preview-image" src="" alt="Предпросмотр">
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Отправить отзыв</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script>
        let photoBase64 = null;
        let selectedRating = 5;

        document.querySelectorAll('.star-rating input').forEach(function(input) {
            input.addEventListener('change', function() {
                selectedRating = parseInt(this.value);
            });
        });

        document.getElementById('star5').checked = true;

        document.getElementById('reviewPhoto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoBase64 = e.target.result;
                    const preview = document.getElementById('previewImage');
                    preview.src = photoBase64;
                    preview.style.display = 'block';
                    document.querySelector('.file-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        async function loadReviews() {
            try {
                const response = await fetch('/api/reviews');
                const data = await response.json();
                const grid = document.getElementById('reviewsGrid');
                
                if (data.reviews.length === 0) {
                    grid.innerHTML = '<p style="color: #666;">Отзывов пока нет.</p>';
                    return;
                }
                
                grid.innerHTML = data.reviews.map(r => `
                    <div class="card">
                        ${r.photo_url ? `<img src="${r.photo_url}" alt="Фото отзыва" class="review-photo">` : ''}
                        <div class="card-content">
                            <h3>${r.author_name}</h3>
                            <p style="color: #F4B740; font-size: 20px;">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</p>
                            <p style="color: #666;">${r.text}</p>
                            <p style="color: #999; font-size: 12px;">${new Date(r.created_at).toLocaleDateString('ru-RU')}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorAlert = document.getElementById('errorAlert');
            const errorList = document.getElementById('errorList');
            const successAlert = document.getElementById('successAlert');
            
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';
            errorList.innerHTML = '';

            const authorName = document.getElementById('reviewName').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            if (!authorName || !text) {
                errorAlert.style.display = 'block';
                const li = document.createElement('li');
                li.textContent = 'Заполните все обязательные поля.';
                errorList.appendChild(li);
                return;
            }

            try {
                const response = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        authorName: authorName, 
                        rating: selectedRating, 
                        text: text,
                        photoBase64: photoBase64
                    })
                });
                
                const data = await response.json();

                if (data.success) {
                    successAlert.style.display = 'block';
                    document.getElementById('reviewForm').reset();
                    document.getElementById('star5').checked = true;
                    selectedRating = 5;
                    photoBase64 = null;
                    document.getElementById('previewImage').style.display = 'none';
                    document.querySelector('.file-placeholder').style.display = 'block';
                    setTimeout(function() {
                        successAlert.style.display = 'none';
                    }, 3000);
                } else {
                    errorAlert.style.display = 'block';
                    const li = document.createElement('li');
                    li.textContent = data.message || 'Ошибка отправки.';
                    errorList.appendChild(li);
                }
            } catch (error) {
                console.error('Ошибка:', error);
                errorAlert.style.display = 'block';
                const li = document.createElement('li');
                li.textContent = 'Ошибка соединения с сервером.';
                errorList.appendChild(li);
            }
        });

        loadReviews();
    </script>
</body>
</html>
