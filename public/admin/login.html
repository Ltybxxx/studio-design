<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход администратора - InteriorStudio</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <main>
        <section class="admin-login">
            <div class="admin-login-card">
                <div class="admin-logo">
                    <h1>InteriorStudio</h1>
                    <p>Панель управления</p>
                </div>
                <form id="adminLoginForm" class="admin-form">
                    <div class="form-group">
                        <label for="adminLogin">Логин</label>
                        <input type="text" id="adminLogin" name="adminLogin" required placeholder="Введите логин">
                    </div>
                    <div class="form-group">
                        <label for="adminPassword">Пароль</label>
                        <input type="password" id="adminPassword" name="adminPassword" required placeholder="Введите пароль">
                    </div>
                    <button type="submit" class="btn btn-primary btn-admin">Войти</button>
                </form>
                <a href="../index.html" class="back-to-site">Вернуться на сайт</a>
            </div>
        </section>
    </main>

    <script src="../js/admin.js"></script>
</body>
</html>
