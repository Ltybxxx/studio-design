<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - InteriorStudio</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main>
        <section class="section" style="min-height: 70vh; display: flex; align-items: center;">
            <div class="container">
                <div style="max-width: 480px; margin: 0 auto;">
                    <h1 style="text-align: center;">Вход</h1>
                    <p style="text-align: center; color: #666; margin-bottom: 24px;">Введите ваши данные</p>
                    
                    <div class="alert alert-info">
                        <p><strong>Тестовый аккаунт:</strong></p>
                        <p>Email: test@test.ru</p>
                        <p>Пароль: test123</p>
                    </div>
                    
                    <div class="alert alert-error" id="errorAlert" style="display: none;">
                        <ul id="errorList"></ul>
                    </div>
                    
                    <div class="card">
                        <div class="card-content" style="padding: 32px;">
                            <form id="loginForm">
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email</label>
                                    <input type="email" id="loginEmail" required placeholder="Введите email" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Пароль</label>
                                    <input type="password" id="loginPassword" required placeholder="Введите пароль" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%;">Войти</button>
                            </form>
                            <p style="text-align: center; margin-top: 20px;">
                                Нет аккаунта? <a href="/register.html" style="color: #C27B5C;">Зарегистрироваться</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorAlert = document.getElementById('errorAlert');
            const errorList = document.getElementById('errorList');
            errorAlert.style.display = 'none';
            errorList.innerHTML = '';

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();

            if (data.success) {
                window.location.href = '/cabinet.html';
            } else {
                errorAlert.style.display = 'block';
                const li = document.createElement('li');
                li.textContent = data.message;
                errorList.appendChild(li);
            }
        });
    </script>
</body>
</html>
