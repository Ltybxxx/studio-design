<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteriorStudio - Студия интерьерного дизайна</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main>
        <section class="hero" style="padding: 80px 0; background: #F5F0E8;">
            <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;">
                <div>
                    <h1>Создаём интерьер вашей мечты</h1>
                    <p style="font-size: 18px; color: #666; margin-bottom: 32px;">Разработка дизайн-проектов квартир, домов и коммерческих помещений.</p>
                    <div style="display: flex; gap: 16px;">
                        <a href="/request.html" class="btn btn-primary">Получить консультацию</a>
                        <a href="/portfolio.html" class="btn btn-secondary">Смотреть портфолио</a>
                    </div>
                </div>
                <div>
                    <img src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=800" alt="Современный интерьер" style="border-radius: 8px; width: 100%; height: 400px; object-fit: cover;">
                </div>
            </div>
        </section>

        <section class="section">
            <div class="container">
                <div class="section-header">
                    <h2>Наши услуги</h2>
                    <p>Полный спектр услуг в сфере интерьерного дизайна</p>
                </div>
                <div class="grid-4" id="servicesGrid"></div>
            </div>
        </section>

        <section class="section" style="background: #F5F0E8;">
            <div class="container">
                <div class="section-header">
                    <h2>Последние проекты</h2>
                    <p>Работы, которыми мы гордимся</p>
                </div>
                <div class="grid-3" id="portfolioGrid"></div>
                <div class="text-center" style="margin-top: 40px;">
                    <a href="/portfolio.html" class="btn btn-secondary">Все проекты</a>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script>
        async function loadServices() {
            try {
                const response = await fetch('/api/services');
                const data = await response.json();
                const grid = document.getElementById('servicesGrid');
                
                grid.innerHTML = '';
                
                if (data.services && data.services.length > 0) {
                    grid.innerHTML = data.services.map(s => `
                        <div class="card">
                            <img src="${s.image_url}" alt="${s.title}" class="card-image">
                            <div class="card-content">
                                <h3>${s.title}</h3>
                                <p>${s.description}</p>
                                <p style="color: #C27B5C; font-weight: 700;">от ${s.price_from} руб.</p>
                                <a href="/request.html" class="btn-small" style="margin-top: 12px;">Заказать</a>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Ошибка загрузки услуг:', error);
                document.getElementById('servicesGrid').innerHTML = '<p style="color: #666;">Не удалось загрузить услуги.</p>';
            }
        }

        async function loadProjects() {
            try {
                const response = await fetch('/api/projects');
                const data = await response.json();
                const grid = document.getElementById('portfolioGrid');
                
                grid.innerHTML = '';
                
                if (data.projects && data.projects.length > 0) {
                    grid.innerHTML = data.projects.slice(0, 3).map(p => `
                        <div class="card">
                            <img src="${p.image_url}" alt="${p.title}" class="card-image">
                            <div class="card-content">
                                <h3>${p.title}</h3>
                                <p>${p.room_type} | ${p.area} м² | ${p.style}</p>
                                <a href="/project-card.html?id=${p.id}" class="btn-small">Смотреть проект</a>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Ошибка загрузки проектов:', error);
                document.getElementById('portfolioGrid').innerHTML = '<p style="color: #666;">Не удалось загрузить проекты.</p>';
            }
        }

        loadServices();
        loadProjects();
    </script>
</body>
</html>
