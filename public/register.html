<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - InteriorStudio</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <main>
        <section class="section" style="min-height: 70vh; display: flex; align-items: center;">
            <div class="container">
                <div style="max-width: 480px; margin: 0 auto;">
                    <h1 style="text-align: center;">Регистрация</h1>
                    <p style="text-align: center; color: #666; margin-bottom: 24px;">Создайте аккаунт</p>
                    
                    <div class="alert alert-error" id="errorAlert" style="display: none;">
                        <ul id="errorList"></ul>
                    </div>
                    
                    <div class="card">
                        <div class="card-content" style="padding: 32px;">
                            <form id="registerForm">
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Имя *</label>
                                    <input type="text" id="regName" required placeholder="Ваше имя" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email *</label>
                                    <input type="email" id="regEmail" required placeholder="example@mail.ru" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Телефон</label>
                                    <input type="tel" id="regPhone" placeholder="+7 (___) ___-__-__" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Пароль *</label>
                                    <input type="password" id="regPassword" required placeholder="Не менее 6 символов" minlength="6" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <div style="margin-bottom: 20px;">
                                    <label style="display: block; margin-bottom: 8px; font-weight: 500;">Подтверждение пароля *</label>
                                    <input type="password" id="regPasswordConfirm" required placeholder="Повторите пароль" minlength="6" style="width: 100%; padding: 12px; border: 1px solid #E0E0E0; border-radius: 8px; font-size: 16px;">
                                </div>
                                <button type="submit" class="btn btn-primary" style="width: 100%;">Зарегистрироваться</button>
                            </form>
                            <p style="text-align: center; margin-top: 20px;">
                                Уже есть аккаунт? <a href="/login.html" style="color: #C27B5C;">Войти</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorAlert = document.getElementById('errorAlert');
            const errorList = document.getElementById('errorList');
            errorAlert.style.display = 'none';
            errorList.innerHTML = '';

            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;

            if (password !== passwordConfirm) {
                errorAlert.style.display = 'block';
                const li = document.createElement('li');
                li.textContent = 'Пароли не совпадают.';
                errorList.appendChild(li);
                return;
            }

            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone, password })
            });
            
            const data = await response.json();

            if (data.success) {
                window.location.href = '/cabinet.html';
            } else {
                errorAlert.style.display = 'block';
                const li = document.createElement('li');
                li.textContent = data.message;
                errorList.appendChild(li);
            }
        });
    </script>
</body>
</html>
